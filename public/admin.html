<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>兑换码后台｜对话观察室</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #22243a; --muted: #77798f; --purple: #6558d9; --purple-soft: #f1efff;
      --line: #e9e8f1; --surface: #fff; --page-bg: #f8f8fc; --soft: #9697a8;
      --error: #bd5360; --ok: #3d9275; --field-bg: #fff; --field-border: #e4e3ed;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --ink: #eeedf7; --muted: #b0aec3; --purple: #b4aaff; --purple-soft: #292541;
        --line: #373547; --surface: #1e1d29; --page-bg: #12121b; --soft: #a29fb5;
        --error: #f29aa2; --ok: #91d9b8; --field-bg: #24232f; --field-border: #454355;
      }
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; padding: 28px 18px 40px; color: var(--ink); background: var(--page-bg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.6; }
    .shell { width: min(860px, 100%); margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 18px; letter-spacing: -.02em; }
    .card { padding: 22px 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 12px 40px rgba(45, 39, 94, .08); margin-bottom: 16px; }
    h2 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    input, textarea, button { font: inherit; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--field-border); border-radius: 10px; color: var(--ink); background: var(--field-bg); outline: none; }
    input:focus, textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(101, 88, 217, .12); }
    textarea { min-height: 120px; resize: vertical; font-size: 12px; line-height: 1.7; font-family: ui-monospace, Menlo, Consolas, monospace; }
    button { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border: 0; border-radius: 10px; color: #fff; background: linear-gradient(135deg, #7569e2, #5b4fcf); font-size: 12px; font-weight: 700; cursor: pointer; }
    button.secondary { color: var(--muted); background: var(--surface); border: 1px solid var(--line); font-weight: 600; }
    button:disabled { opacity: .6; cursor: wait; }
    .btn-link { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px; border-radius: 10px; color: #fff; background: linear-gradient(135deg, #7569e2, #5b4fcf); font-size: 12px; font-weight: 700; text-decoration: none; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .msg { margin: 10px 0 0; font-size: 12px; min-height: 18px; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--error); }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .stat { padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .stat b { display: block; font-size: 22px; font-weight: 760; }
    .stat span { color: var(--soft); font-size: 11px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { color: var(--soft); font-weight: 600; }
    code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .status-ok { color: var(--ok); }
    .status-wait { color: var(--soft); }
    .hint { color: var(--soft); font-size: 11px; }
    .whoami { margin: 6px 0 0; color: var(--soft); font-size: 11px; }
    .whoami b { color: var(--ink); }
    .topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    a { color: var(--purple); font-size: 12px; }
    [hidden] { display: none !important; }
    @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topline">
      <h1>兑换码后台 · 对话观察室</h1>
      <a href="/">返回调研页</a>
    </div>

    <section class="card" id="gateCard">
      <h2>管理员后台</h2>
      <p class="hint" id="gateText">正在检查登录状态…</p>
      <div class="row" style="margin-top: 12px">
        <a class="btn-link" id="loginLink" href="/api/auth/login?next=%2Fadmin" hidden>使用奶酪账号登录</a>
        <button class="secondary" id="gateLogout" type="button" hidden>退出登录</button>
      </div>
    </section>

    <section class="card" id="dashCard" hidden>
      <div class="topline">
        <div><h2 style="margin: 0">数据概览</h2><p class="whoami">已登录：<b id="whoami">-</b>（管理员）</p></div>
        <div class="row"><button class="secondary" id="refreshButton" type="button">刷新</button><button class="secondary" id="logoutButton" type="button">退出登录</button></div>
      </div>
      <div class="stats">
        <div class="stat"><b id="statTotal">0</b><span>兑换码总数</span></div>
        <div class="stat"><b id="statAssigned">0</b><span>已发放</span></div>
        <div class="stat"><b id="statRemaining">0</b><span>剩余可发放</span></div>
        <div class="stat"><b id="statSubmissions">0</b><span>答卷数</span></div>
      </div>
    </section>

    <section class="card" id="addCard" hidden>
      <h2>添加兑换码</h2>
      <label for="codesInput">每行一个，也支持逗号 / 分号分隔（仅限字母、数字、-、_；3–64 位，且至少含一个字母或数字）</label>
      <textarea id="codesInput" placeholder="例：&#10;NAILAO-AAA-001&#10;NAILAO-AAA-002"></textarea>
      <div class="row" style="margin-top: 12px"><button id="addButton" type="button">导入兑换码</button><span class="hint">一次最多 200 个</span></div>
      <p class="msg" id="addMessage"></p>
    </section>

    <section class="card" id="listCard" hidden>
      <h2>最近 50 个兑换码</h2>
      <table>
        <thead><tr><th>兑换码</th><th>状态</th></tr></thead>
        <tbody id="codesBody"></tbody>
      </table>
      <p class="hint" id="listEmpty" hidden>暂无兑换码。</p>
    </section>
  </div>

  <script>
    (() => {
      'use strict';
      const $ = (id) => document.getElementById(id);
      const gateCard = $('gateCard'), dashCard = $('dashCard'), addCard = $('addCard'), listCard = $('listCard');
      const gateText = $('gateText'), loginLink = $('loginLink'), gateLogout = $('gateLogout');
      const addMessage = $('addMessage'), codesBody = $('codesBody'), listEmpty = $('listEmpty');

      async function api(path, options = {}) {
        const response = await fetch(path, { credentials: 'same-origin', ...options });
        let data = null;
        try { data = await response.json(); } catch (_) { data = null; }
        return { response, data };
      }

      function showGate(text, options = {}) {
        gateCard.hidden = false; dashCard.hidden = true; addCard.hidden = true; listCard.hidden = true;
        gateText.textContent = text;
        loginLink.hidden = !options.login;
        gateLogout.hidden = !options.logout;
      }

      function showDashboard() {
        gateCard.hidden = true; dashCard.hidden = false; addCard.hidden = false; listCard.hidden = false;
      }

      function fmtTime(value) {
        if (!value) return '';
        const time = new Date(value);
        return Number.isNaN(time.getTime()) ? String(value) : time.toLocaleString();
      }

      function renderCodes(recent) {
        codesBody.replaceChildren();
        listEmpty.hidden = recent.length > 0;
        for (const item of recent) {
          const row = document.createElement('tr');
          const cellCode = document.createElement('td');
          const code = document.createElement('code');
          code.textContent = item.code;
          cellCode.appendChild(code);
          const cellState = document.createElement('td');
          if (item.assigned) {
            const span = document.createElement('span');
            span.className = 'status-ok';
            span.textContent = '已发放' + (item.assignedToName ? '：' + item.assignedToName : '') + (item.assignedAt ? '（' + fmtTime(item.assignedAt) + '）' : '');
            cellState.appendChild(span);
          } else {
            const span = document.createElement('span');
            span.className = 'status-wait';
            span.textContent = '未发放 ';
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'secondary';
            button.textContent = '删除';
            button.style.minHeight = '28px';
            button.style.padding = '0 10px';
            button.addEventListener('click', () => deleteCode(item.code));
            cellState.appendChild(span);
            cellState.appendChild(button);
          }
          row.appendChild(cellCode);
          row.appendChild(cellState);
          codesBody.appendChild(row);
        }
      }

      async function loadStats() {
        const { response, data } = await api('/api/admin/stats');
        if (response.status === 401) { showGate('请先用奶酪账号登录；管理员账号登录后会自动进入后台。', { login: true }); return false; }
        if (response.status === 403) { showGate('当前账号没有后台权限。可以用管理员账号登录，或退出后切换账号。', { logout: true }); return false; }
        if (!response.ok || !data || !data.ok) { showGate((data && data.error) || '后台数据加载失败，请稍后重试。', { logout: true }); return false; }
        showDashboard();
        $('statTotal').textContent = String(data.total);
        $('statAssigned').textContent = String(data.assigned);
        $('statRemaining').textContent = String(Math.max(0, (data.total || 0) - (data.assigned || 0)));
        $('statSubmissions').textContent = String(data.submissions);
        renderCodes(data.recent || []);
        return true;
      }

      async function init() {
        const { response, data } = await api('/api/auth/me');
        if (!response.ok || !data || !data.ok) { showGate('无法连接服务器，请从部署后的网址访问。'); return; }
        if (!data.configured) { showGate('登录功能尚未配置完成。'); return; }
        if (!data.authenticated) {
          showGate('请先用奶酪账号登录；管理员账号（昵称在 ADMIN_USERNAMES 中，默认 nailao）会自动进入后台。', { login: true });
          return;
        }
        if (!data.admin) {
          showGate('当前账号（' + ((data.user && data.user.name) || '未知') + '）不是管理员。默认管理员昵称：nailao。', { logout: true });
          return;
        }
        $('whoami').textContent = (data.user && data.user.name) || '管理员';
        await loadStats();
      }

      $('addButton').addEventListener('click', async () => {
        const codes = $('codesInput').value.split(/[\n\r,，;；]+/).map((item) => item.trim()).filter(Boolean);
        if (!codes.length) { addMessage.textContent = '请先粘贴兑换码。'; addMessage.className = 'msg err'; return; }
        addMessage.textContent = '正在导入…';
        addMessage.className = 'msg';
        $('addButton').disabled = true;
        try {
          const { response, data } = await api('/api/admin/codes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ codes }),
          });
          if (!response.ok || !data || !data.ok) { addMessage.textContent = (data && data.error) || '导入失败，请重试。'; addMessage.className = 'msg err'; return; }
          let text = '已导入 ' + data.added + ' 个' + (data.duplicates ? '，重复跳过 ' + data.duplicates + ' 个' : '');
          if (data.invalid && data.invalid.length) text += '；被拒绝 ' + data.invalid.length + ' 个（格式不合规）';
          addMessage.textContent = text;
          addMessage.className = 'msg ok';
          $('codesInput').value = '';
          await loadStats();
        } catch (_) {
          addMessage.textContent = '网络异常，请稍后重试。';
          addMessage.className = 'msg err';
        } finally {
          $('addButton').disabled = false;
        }
      });

      async function deleteCode(code) {
        if (!window.confirm('确定删除未发放的兑换码 ' + code + ' 吗？')) return;
        try {
          const { response, data } = await api('/api/admin/codes/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code }),
          });
          if (!response.ok || !data || !data.ok) {
            addMessage.textContent = (data && data.error) || '删除失败。';
            addMessage.className = 'msg err';
          } else {
            addMessage.textContent = '已删除 ' + code;
            addMessage.className = 'msg ok';
          }
          await loadStats();
        } catch (_) {
          addMessage.textContent = '网络异常，请稍后重试。';
          addMessage.className = 'msg err';
        }
      }

      $('refreshButton').addEventListener('click', () => { loadStats(); });
      $('logoutButton').addEventListener('click', async () => {
        try { await api('/api/auth/logout', { method: 'POST' }); } catch (_) {}
        location.reload();
      });
      gateLogout.addEventListener('click', async () => {
        try { await api('/api/auth/logout', { method: 'POST' }); } catch (_) {}
        location.reload();
      });

      init();
    })();
  </script>
</body>
</html>

#:schema node_modules/wrangler/config-schema.json
name = "conversation-lab-survey"
main = "src/index.js"
compatibility_date = "2025-05-07"

# 自定义域名（部署时绑定 sjb.nailao.biz；该域名需与本 Worker 在同一 Cloudflare 账号下）
routes = [
  { pattern = "sjb.nailao.biz", custom_domain = true }
]

[vars]
# OAuth 登录（提供方：nailao.biz）
OAUTH_ISSUER = "https://nailao.biz"
OAUTH_CLIENT_ID = "llC-CcjaadCD_AZuX8xjb87ULXC5YMwZ"
OAUTH_CLIENT_SECRET = "UvRV0z8cKJaiTYiL4Q61i-v0u8gJ8KbWRh_SKt9_6rPaU3tu"
# 会话签名密钥（可自行更换；如需收紧安全，可改用加密变量）
SESSION_SECRET = "afe6976afc02f2506fdbfb63aa3bf4153e8a71820b48b9766a022d43b60624e4"
# 后台管理员昵称（多个用逗号分隔；这些 OAuth 昵称登录后可进入 /admin 后台，默认含 nailao）
ADMIN_USERNAMES = "nailao"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "sjb"
database_id = "15beb510-ea07-478c-b48d-ac83321953bf"
migrations_dir = "migrations"

[env.dev]
name = "conversation-lab-survey-dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "sjb"
database_id = "local-dev-db"
migrations_dir = "migrations"
